# Bob development configuration.
#
# Loaded automatically by scripts/bob-dev.sh (and therefore run-bob-dev.sh),
# which points XDG_CONFIG_HOME at scripts/bob-dev-config so bob reads this file
# at $XDG_CONFIG_HOME/bob/config.toml.
#
# Single-user, local-only setup. The policy pre-flight gate admits requests by
# application identity (a UUID), not by OS user. `bob chat` always asserts the
# default chat identity below (chat_application_identity), so admitting that one
# UUID is what lets `bob chat` through the gate.
#
# NOTE: the policy engine has no "admit any user" wildcard today, so this is a
# stopgap that admits the single identity bob chat uses. Removing the
# per-request identity check entirely (the right fix for a single-user local
# deployment) is to be tracked as a separate change request.

[policy]
admitted_users = ["00000000-0000-0000-0000-000000000001"]
