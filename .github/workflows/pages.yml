name: Pages

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: pages-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

# The build job runs on pull requests and on pushes to main so a branch can
# check the manual build. Only the deploy job publishes, and only for main.
# Jobs run in the official node:24.22.0-bookworm image as root, like the CI workflow.
jobs:
  build:
    name: Build manual
    runs-on: self-hosted
    container:
      image: node:24.22.0-bookworm
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: npm ci

      - name: Build user documentation
        run: npm run docs:build

      # VitePress writes the site to .tmp/manual-site (outDir in docs/manual/.vitepress/config.ts).
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .tmp/manual-site

  deploy:
    name: Deploy manual
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: self-hosted
    container:
      image: node:24.22.0-bookworm
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
