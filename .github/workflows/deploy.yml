name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

env:
  SERVICE_DIR: the-intern/service
  DOCS_DIR: the-intern/docs

jobs:
  release:
    runs-on: self-hosted
    container:
      image: rust-dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build release binary
        working-directory: ${{ env.SERVICE_DIR }}
        run: cargo build --release -p bob

      - name: Cache cargo registry for mdbook tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/mdbook
            ~/.cargo/bin/mdbook-mermaid
          key: mdbook-tools-${{ runner.os }}-mdbook-0.4-mermaid-0.14

      - name: Install mdbook and mdbook-mermaid
        run: |
          if ! command -v mdbook &>/dev/null; then
            cargo install mdbook --locked
          fi
          if ! command -v mdbook-mermaid &>/dev/null; then
            cargo install mdbook-mermaid --locked
          fi

      - name: Build docs
        working-directory: ${{ env.DOCS_DIR }}
        env:
          BOB_BIN: ${{ github.workspace }}/${{ env.SERVICE_DIR }}/target/release/bob
        run: mdbook build

      - name: Archive docs
        run: |
          tar -czf the-intern-docs-${{ github.ref_name }}.tar.gz \
            -C ${{ env.DOCS_DIR }} book

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            ${{ env.SERVICE_DIR }}/target/release/bob
            the-intern-docs-${{ github.ref_name }}.tar.gz
