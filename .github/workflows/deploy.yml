name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

env:
  SERVICE_DIR: the-intern/service

jobs:
  release:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build release binary
        working-directory: ${{ env.SERVICE_DIR }}
        run: cargo build --release -p bob

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: ${{ env.SERVICE_DIR }}/target/release/bob
