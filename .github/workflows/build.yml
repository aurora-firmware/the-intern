name: CI

on:
  pull_request:
  push:
    branches:
      - dev-agent
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

# Placeholders: the TypeScript package doesn't exist yet. Each job keeps its
# name so required checks stay stable; replace the step when the package lands.
# Jobs run in the devcontainer image as root, like main's Rust container jobs,
# so files left in the shared runner workspace always have the same owner.
jobs:
  format:
    name: Format
    runs-on: self-hosted
    container:
      image: localhost:5000/nodejs-dev:1.3.0
    steps:
      - name: Checkout
        uses: actions/checkout@v6

