name: CI

on:
  pull_request:
  push:
    branches:
      - dev-pi-durable
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

# Each job keeps its name so required checks stay stable. Jobs run in the
# official node:24.22.0-bookworm image as root, so files left in the shared runner
# workspace always have the same owner.
jobs:
  format:
    name: Format
    runs-on: self-hosted
    container:
      image: node:24.22.0-bookworm
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

  build:
    name: Build
    runs-on: self-hosted
    container:
      image: node:24.22.0-bookworm
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

  user-docs:
    name: User Documentation
    runs-on: self-hosted
    container:
      image: node:24.22.0-bookworm
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        run: npm ci

      - name: Build user documentation
        run: npm run docs:build

  tests:
    name: Tests
    runs-on: self-hosted
    container:
      image: node:24.22.0-bookworm
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        run: npm ci

      - name: Install browsers for web tests
        run: npm run test:web:setup

      - name: Run tests
        env:
          BOB_WEB_ALL_BROWSERS: "1"
        run: npm test
