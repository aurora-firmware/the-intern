name: CI

on:
  pull_request:
  push:
    branches:
      - dev-agent
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  SERVICE_DIR: the-intern/service
  DOCS_DIR: the-intern/docs
  CI_CONTAINER_IMAGE: localhost:5000/rust-dev:1.0.1
  CARGO_CACHE_DIR: .cargo-ci
  RUSTUP_TOOLCHAIN: 1.96.0-x86_64-unknown-linux-gnu
  MDBOOK_VERSION: 0.4.52
  MDBOOK_MERMAID_VERSION: 0.14.0

jobs:
  format:
    name: Format
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check Rust formatting
        run: |
          mkdir -p "$GITHUB_WORKSPACE/${{ env.CARGO_CACHE_DIR }}"
          podman run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -v "$GITHUB_WORKSPACE/${{ env.CARGO_CACHE_DIR }}:/ci-cargo" \
            -w "/work/${{ env.SERVICE_DIR }}" \
            -e CARGO_TERM_COLOR \
            -e RUSTUP_TOOLCHAIN \
            -e CARGO_HOME=/ci-cargo \
            "$CI_CONTAINER_IMAGE" \
            sh -lc 'export PATH="/ci-cargo/bin:$PATH"; cargo fmt --all -- --check'

  build:
    name: Build
    runs-on: self-hosted
    env:
      RUSTUP_TOOLCHAIN: 1.96.0-x86_64-unknown-linux-gnu
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build bob
        run: |
          mkdir -p "$GITHUB_WORKSPACE/${{ env.CARGO_CACHE_DIR }}"
          podman run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -v "$GITHUB_WORKSPACE/${{ env.CARGO_CACHE_DIR }}:/ci-cargo" \
            -w "/work/${{ env.SERVICE_DIR }}" \
            -e CARGO_TERM_COLOR \
            -e RUSTUP_TOOLCHAIN \
            -e CARGO_HOME=/ci-cargo \
            "$CI_CONTAINER_IMAGE" \
            sh -lc 'export PATH="/ci-cargo/bin:$PATH"; cargo build -p bob'

  documentation:
    name: Documentation
    runs-on: self-hosted
    env:
      RUSTUP_TOOLCHAIN: 1.96.0-x86_64-unknown-linux-gnu
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Generate Rust documentation
        run: |
          mkdir -p "$GITHUB_WORKSPACE/${{ env.CARGO_CACHE_DIR }}"
          podman run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -v "$GITHUB_WORKSPACE/${{ env.CARGO_CACHE_DIR }}:/ci-cargo" \
            -w "/work/${{ env.SERVICE_DIR }}" \
            -e CARGO_TERM_COLOR \
            -e RUSTUP_TOOLCHAIN \
            -e CARGO_HOME=/ci-cargo \
            "$CI_CONTAINER_IMAGE" \
            sh -lc 'export PATH="/ci-cargo/bin:$PATH"; cargo doc --workspace --no-deps'

      - name: Remove rendered source from documentation artifact
        run: rm -rf "${{ env.SERVICE_DIR }}/target/doc/src"

      - name: Upload generated documentation
        uses: actions/upload-artifact@v6
        with:
          name: rust-docs
          path: ${{ env.SERVICE_DIR }}/target/doc
          if-no-files-found: error

  user-docs:
    name: User Documentation
    runs-on: self-hosted
    env:
      RUSTUP_TOOLCHAIN: 1.96.0-x86_64-unknown-linux-gnu
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Reject internal project doc links
        run: |
          if grep -RInE 'project/(decisions|docs|specs)' "${{ env.DOCS_DIR }}/src"; then
            echo "user docs must not link into internal project documents"
            exit 1
          fi

      - name: Build bob (for CLI reference preprocessor)
        run: |
          mkdir -p "$GITHUB_WORKSPACE/${{ env.CARGO_CACHE_DIR }}"
          podman run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -v "$GITHUB_WORKSPACE/${{ env.CARGO_CACHE_DIR }}:/ci-cargo" \
            -w "/work/${{ env.SERVICE_DIR }}" \
            -e CARGO_TERM_COLOR \
            -e RUSTUP_TOOLCHAIN \
            -e CARGO_HOME=/ci-cargo \
            "$CI_CONTAINER_IMAGE" \
            sh -lc 'export PATH="/ci-cargo/bin:$PATH"; cargo build -p bob'

      - name: Cache cargo registry for mdbook tools
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.CARGO_CACHE_DIR }}/registry
            ${{ env.CARGO_CACHE_DIR }}/git
            ${{ env.CARGO_CACHE_DIR }}/bin/mdbook
            ${{ env.CARGO_CACHE_DIR }}/bin/mdbook-mermaid
          key: mdbook-tools-${{ runner.os }}-mdbook-${{ env.MDBOOK_VERSION }}-mermaid-${{ env.MDBOOK_MERMAID_VERSION }}

      - name: Install mdbook and mdbook-mermaid
        run: |
          mkdir -p "$GITHUB_WORKSPACE/${{ env.CARGO_CACHE_DIR }}"
          podman run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -v "$GITHUB_WORKSPACE/${{ env.CARGO_CACHE_DIR }}:/ci-cargo" \
            -w "/work" \
            -e CARGO_TERM_COLOR \
            -e RUSTUP_TOOLCHAIN \
            -e CARGO_HOME=/ci-cargo \
            -e MDBOOK_VERSION \
            -e MDBOOK_MERMAID_VERSION \
            "$CI_CONTAINER_IMAGE" \
            sh -lc '
              export PATH="/ci-cargo/bin:$PATH"
              if ! mdbook --version 2>/dev/null | grep -q "mdbook v${MDBOOK_VERSION}"; then
                cargo install mdbook --version "${MDBOOK_VERSION}" --locked --force
              fi
              if ! mdbook-mermaid --version 2>/dev/null | grep -q "${MDBOOK_MERMAID_VERSION}"; then
                cargo install mdbook-mermaid --version "${MDBOOK_MERMAID_VERSION}" --locked --force
              fi
            '

      - name: Build docs
        run: |
          podman run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -v "$GITHUB_WORKSPACE/${{ env.CARGO_CACHE_DIR }}:/ci-cargo" \
            -w "/work/${{ env.DOCS_DIR }}" \
            -e CARGO_TERM_COLOR \
            -e RUSTUP_TOOLCHAIN \
            -e CARGO_HOME=/ci-cargo \
            -e BOB_BIN=/work/${{ env.SERVICE_DIR }}/target/debug/bob \
            "$CI_CONTAINER_IMAGE" \
            sh -lc 'export PATH="/ci-cargo/bin:$PATH"; mdbook build'

      - name: Upload user documentation
        uses: actions/upload-artifact@v6
        with:
          name: user-docs
          path: ${{ env.DOCS_DIR }}/book
          if-no-files-found: error

  tests:
    name: Tests
    runs-on: self-hosted
    env:
      RUSTUP_TOOLCHAIN: 1.96.0-x86_64-unknown-linux-gnu
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run Rust tests
        id: cargo-test
        shell: bash
        run: |
          set +e
          mkdir -p "$GITHUB_WORKSPACE/${{ env.CARGO_CACHE_DIR }}"
          podman run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -v "$GITHUB_WORKSPACE/${{ env.CARGO_CACHE_DIR }}:/ci-cargo" \
            -w "/work/${{ env.SERVICE_DIR }}" \
            -e CARGO_TERM_COLOR \
            -e RUSTUP_TOOLCHAIN \
            -e CARGO_HOME=/ci-cargo \
            "$CI_CONTAINER_IMAGE" \
            sh -lc 'export PATH="/ci-cargo/bin:$PATH"; cargo test --workspace' \
            > "$RUNNER_TEMP/cargo-test.raw.log" 2>&1
          test_status=$?

          sed \
            -e "s#${HOME}#\$HOME#g" \
            -e 's/[A-Za-z0-9_]*\(TOKEN\|SECRET\|PASSWORD\|PASSWD\|API_KEY\|PRIVATE_KEY\)[A-Za-z0-9_]*=[^[:space:]]*/REDACTED_SECRET_ENV/gI' \
            "$RUNNER_TEMP/cargo-test.raw.log" > "$RUNNER_TEMP/cargo-test.log"

          cat "$RUNNER_TEMP/cargo-test.log"

          {
            echo "## Rust test report"
            echo
            echo '```text'
            tail -n 80 "$RUNNER_TEMP/cargo-test.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$test_status"

      - name: Upload Rust test report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rust-test-report
          path: ${{ runner.temp }}/cargo-test.log
          if-no-files-found: error
