[package]
name = "pi-agent-supervisor"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["rt", "sync", "net", "signal", "macros", "process", "io-util", "time"] }
bob-core = { path = "../bob-core" }
tracing = "0.1"
async-trait = { workspace = true }
serde_json = "1"
nix = { version = "0.29", default-features = false, features = ["signal"] }

[lints]
workspace = true
