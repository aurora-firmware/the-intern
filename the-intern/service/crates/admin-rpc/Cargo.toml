[package]
name = "admin-rpc"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["rt", "sync", "net", "signal", "macros", "io-util"] }
bob-core = { path = "../bob-core" }
chat-adapter = { path = "../chat-adapter" }
pi-agent-supervisor = { path = "../pi-agent-supervisor" }
policy-control = { path = "../policy-control" }
monitoring = { path = "../monitoring" }
scheduler-adapter = { path = "../scheduler-adapter" }
croner = "3"
toml = "0.8"
toml_edit = "0.22"
chrono = "0.4"
uuid = { workspace = true }
tracing = "0.1"
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
nix = { version = "0.29", default-features = false, features = ["socket", "user"] }

[dev-dependencies]
requests-handler = { path = "../requests-handler" }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }

[lints]
workspace = true
