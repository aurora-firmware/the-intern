[package]
name = "bob"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }
bob-core = { path = "../bob-core" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
figment = { version = "0.10", features = ["toml", "env"] }
nix = { version = "0.29", default-features = false, features = ["user", "socket", "uio"] }
croner = "3"
admin-rpc = { path = "../admin-rpc" }
extension-ipc = { path = "../extension-ipc" }
requests-handler = { path = "../requests-handler" }
monitoring = { path = "../monitoring" }
persistence = { path = "../persistence" }
policy-control = { path = "../policy-control" }
pi-agent-supervisor = { path = "../pi-agent-supervisor" }
scheduler-adapter = { path = "../scheduler-adapter" }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
