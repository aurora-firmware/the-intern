[book]
title = "The Intern — User Documentation"
src = "src"

[build]
build-dir = "book"

[preprocessor.mermaid]
command = "mdbook-mermaid"

# CLI Reference generator.
# Captures `bob --help` and `bob <subcommand> --help` at build time and
# injects the output as CLI reference pages.
#
# Binary discovery order (highest priority first):
#   1. BOB_BIN environment variable
#   2. ../service/target/release/bob
#   3. ../service/target/debug/bob
#
# The `--` separator is required so that the `supports <renderer>` probe
# arguments mdbook appends are forwarded to the binary rather than
# interpreted by cargo.
[preprocessor.cli-reference]
command = "bash -lc 'if [ -f preprocessors/cli-reference/Cargo.toml ]; then exec cargo run --manifest-path preprocessors/cli-reference/Cargo.toml -q -- \"$@\"; else exec cargo run --manifest-path the-intern/docs/preprocessors/cli-reference/Cargo.toml -q -- \"$@\"; fi' _"

[output]

[output.html]
additional-js = ["mermaid.min.js", "mermaid-init.js"]
